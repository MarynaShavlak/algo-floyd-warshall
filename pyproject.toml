[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floyd-warshall-visualized"
version = "1.0.0"
description = "Навчальна реалізація та покрокова візуалізація алгоритму Флойда–Воршала"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Maryna Shavlak", email = "shavlakmaryna@gmail.com" }]
keywords = ["floyd-warshall", "shortest-paths", "graph", "algorithms", "education", "visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Education",
    "Intended Audience :: Education",
]
dependencies = [
    "matplotlib>=3.5",
    "networkx>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["floyd_warshall"]
